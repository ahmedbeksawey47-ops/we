<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام تسجيل الغياب - المعلم أحمد محمد سري</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font: Cairo -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#1e40af',
              lightBlue: '#3b82f6',
              bg: '#f8fafc',
              card: '#ffffff'
            }
          },
          fontFamily: {
            cairo: ['Cairo', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen p-4 sm:p-6 md:p-10 flex flex-col items-center justify-start">

  <div class="w-full max-w-xl space-y-6">

    <!-- Header Section -->
    <div class="bg-gradient-to-r from-blue-900 to-blue-700 text-white p-6 rounded-3xl shadow-lg text-center space-y-2">
      <div class="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center mx-auto text-2xl">
        <i class="fa-solid fa-chalkboard-user"></i>
      </div>
      <span class="text-xs font-bold text-blue-200 tracking-wider">نظام متابعة الحصص الشهرية (8 حصص)</span>
      <h1 class="text-2xl sm:text-3xl font-black">المعلم / أحمد محمد سري</h1>
    </div>

    <!-- Attendance Form Card -->
    <div class="bg-white p-6 sm:p-8 rounded-3xl shadow-md border border-slate-200 space-y-6">
      
      <div class="flex items-center justify-between border-b border-slate-100 pb-4">
        <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-calendar-check text-blue-600"></i>
          تسجيل حصة / غياب جديد
        </h2>
        <span class="text-xs bg-blue-50 text-blue-700 font-bold px-3 py-1 rounded-full border border-blue-100">
          الشهر = 8 حصص
        </span>
      </div>

      <form id="attendanceForm" class="space-y-4">
        
        <!-- Student Name Input -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">اسم الطالب</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="studentName" required placeholder="أدخل اسم الطالب هنا"
              class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-bold focus:outline-none focus:border-blue-600 focus:bg-white transition-all text-sm">
          </div>
        </div>

        <!-- Date Input -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1.5">تاريخ الحصة / اليوم</label>
          <div class="relative">
            <i class="fa-solid fa-calendar-days absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="date" id="lessonDate" required
              class="w-full pr-10 pl-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-slate-800 font-bold focus:outline-none focus:border-blue-600 focus:bg-white transition-all text-sm">
          </div>
        </div>

        <!-- Attendance Status Radio -->
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-2">حالة الحضور</label>
          <div class="grid grid-cols-2 gap-3">
            
            <!-- Present Button -->
            <label class="relative flex items-center justify-center p-3.5 rounded-2xl border-2 border-slate-200 cursor-pointer hover:border-green-500 has-[:checked]:border-green-600 has-[:checked]:bg-green-50/50 transition-all text-center">
              <input type="radio" name="status" value="حاضر" checked class="sr-only">
              <div class="flex items-center gap-2 text-slate-700 font-bold text-sm">
                <i class="fa-solid fa-circle-check text-green-600 text-base"></i>
                <span>حضر الحصة</span>
              </div>
            </label>

            <!-- Absent But Charged Button -->
            <label class="relative flex items-center justify-center p-3.5 rounded-2xl border-2 border-slate-200 cursor-pointer hover:border-amber-500 has-[:checked]:border-amber-600 has-[:checked]:bg-amber-50/50 transition-all text-center">
              <input type="radio" name="status" value="غائب (المعلم حضر)" class="sr-only">
              <div class="flex items-center gap-2 text-slate-700 font-bold text-xs sm:text-sm">
                <i class="fa-solid fa-user-xmark text-amber-600 text-base"></i>
                <span>غائب (تُحسب عليه)</span>
              </div>
            </label>

          </div>
          <p class="text-[11px] text-slate-400 mt-2 text-center">
            * في حالة الغياب مع حضور المعلم، تُخصم الحصة تلقائياً من الـ 8 حصص الشهرية.
          </p>
        </div>

        <!-- Submit Button -->
        <button type="submit" 
          class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3.5 rounded-xl shadow-md transition-all active:scale-95 flex items-center justify-center gap-2 text-base">
          <i class="fa-solid fa-plus-circle"></i>
          <span>تسجيل الحصة / الغياب</span>
        </button>
      </form>

    </div>

    <!-- Student Summary Card -->
    <div class="bg-white p-6 rounded-3xl shadow-md border border-slate-200 space-y-4">
      
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <i class="fa-solid fa-calculator text-blue-600"></i>
          ملخص الحصص للشهر الحقيقي
        </h3>
        <button onclick="searchStudent()" class="text-xs text-blue-600 font-bold hover:underline">
          تحديث / عرض الطالب
        </button>
      </div>

      <!-- Result Display Box -->
      <div id="summaryCard" class="bg-slate-50 p-5 rounded-2xl border border-slate-200 space-y-4 text-center">
        <p class="text-xs text-slate-500 font-bold">اكتب اسم الطالب فوق للبدء أو رؤية حسابه</p>
      </div>

    </div>

    <!-- Simple History List -->
    <div class="bg-white p-6 rounded-3xl shadow-md border border-slate-200 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">
          <i class="fa-solid fa-list-check text-slate-600"></i>
          سجل الحصص المسجلة
        </h3>
        <button onclick="clearAllData()" class="text-xs text-red-500 hover:underline font-bold">
          مسح السجل
        </button>
      </div>

      <div id="logsList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
        <!-- Records render here -->
      </div>
    </div>

  </div>

  <script>
    const STORAGE_KEY = 'teacher_sery_attendance_data';

    // Set default date to today
    document.getElementById('lessonDate').valueAsDate = new Date();

    // Get Data from LocalStorage
    function getData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      return saved ? JSON.parse(saved) : [];
    }

    // Save Data to LocalStorage
    function saveData(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // Handle Form Submit
    document.getElementById('attendanceForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('studentName').value.trim();
      const date = document.getElementById('lessonDate').value;
      const status = document.querySelector('input[name="status"]:checked').value;

      if (!name || !date) return;

      const records = getData();
      
      records.push({
        id: Date.now(),
        teacher: 'أحمد محمد سري',
        student: name,
        date: date,
        status: status // 'حاضر' or 'غائب (المعلم حضر)'
      });

      saveData(records);

      updateSummary(name);
      renderLogs();
      
      // Feedback
      alert(`تم تسجيل الحصة بنجاح للطالب: ${name}`);
    });

    // Student Summary Calculation
    function searchStudent() {
      const name = document.getElementById('studentName').value.trim();
      if (!name) {
        alert('يرجى كتابة اسم الطالب في الخانة أولاً');
        return;
      }
      updateSummary(name);
    }

    function updateSummary(studentName) {
      const records = getData();
      const studentRecords = records.filter(r => r.student.toLowerCase() === studentName.toLowerCase());

      const totalLessonsInMonth = 8;
      // All recorded sessions (Present or Absent with teacher present) count as consumed lessons
      const consumedLessons = studentRecords.length;
      const remainingLessons = Math.max(0, totalLessonsInMonth - consumedLessons);

      const summaryCard = document.getElementById('summaryCard');

      if (consumedLessons === 0) {
        summaryCard.innerHTML = `
          <p class="text-xs text-slate-500 font-bold">لا يوجد حصص مسجلة بعد للطالب: <span class="text-blue-700">${studentName}</span></p>
        `;
        return;
      }

      const isFinished = remainingLessons === 0;

      summaryCard.innerHTML = `
        <div class="text-right border-b border-slate-200 pb-3">
          <span class="text-xs text-slate-400 font-bold block">الطالب:</span>
          <span class="text-lg font-black text-slate-800">${studentName}</span>
        </div>

        <div class="grid grid-cols-2 gap-3 text-center">
          <div class="bg-blue-50 p-3 rounded-xl border border-blue-100">
            <span class="text-[11px] font-bold text-blue-600 block">الحصص المستهلكة</span>
            <span class="text-2xl font-black text-blue-900">${consumedLessons} <span class="text-xs font-normal text-slate-500">من 8</span></span>
          </div>

          <div class="${isFinished ? 'bg-red-50 border-red-100' : 'bg-green-50 border-green-100'} p-3 rounded-xl border">
            <span class="text-[11px] font-bold ${isFinished ? 'text-red-600' : 'text-green-600'} block">الحصص المتبقية</span>
            <span class="text-2xl font-black ${isFinished ? 'text-red-700' : 'text-green-800'}">${remainingLessons} <span class="text-xs font-normal text-slate-500">حصة</span></span>
          </div>
        </div>

        ${isFinished ? `<p class="text-xs font-bold text-red-600 bg-red-100/60 p-2 rounded-lg">⚠️ انتهى اشتراك الـ 8 حصص لهذا الطالب لهذا الشهر.</p>` : ''}
      `;
    }

    // Render Recent Logs
    function renderLogs() {
      const records = getData().reverse(); // show latest first
      const container = document.getElementById('logsList');

      if (records.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-400 text-center py-4">لا توجد غيابات أو حصص مسجلة حتى الآن.</p>`;
        return;
      }

      container.innerHTML = records.map(r => `
        <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200 text-xs">
          <div>
            <span class="font-bold text-slate-800 block">${r.student}</span>
            <span class="text-[10px] text-slate-400">${r.date}</span>
          </div>
          <div class="flex items-center gap-2">
            <span class="font-bold px-2.5 py-1 rounded-lg ${r.status.includes('حاضر') ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-800'}">
              ${r.status}
            </span>
            <button onclick="deleteRecord(${r.id})" class="text-slate-400 hover:text-red-500">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    // Delete single record
    function deleteRecord(id) {
      let records = getData();
      records = records.filter(r => r.id !== id);
      saveData(records);
      renderLogs();
      const currentName = document.getElementById('studentName').value.trim();
      if (currentName) updateSummary(currentName);
    }

    // Clear All
    function clearAllData() {
      if (confirm('هل أنت تأكد من مسح جميع السجلات المسجلة؟')) {
        localStorage.removeItem(STORAGE_KEY);
        renderLogs();
        document.getElementById('summaryCard').innerHTML = `<p class="text-xs text-slate-500 font-bold">تم مسح السجل بنجاح</p>`;
      }
    }

    // Auto-search on typing student name
    document.getElementById('studentName').addEventListener('input', function(e) {
      if (e.target.value.trim()) {
        updateSummary(e.target.value.trim());
      }
    });

    // Initial Load
    renderLogs();
  </script>

</body>
</html>
